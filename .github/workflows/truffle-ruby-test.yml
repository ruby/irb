name: build-with-truffleruby

on:
  push:
  pull_request:
  schedule:
    - cron: "30 14 * * *"

jobs:
  irb:
    if: github.repository == 'ruby/irb' || github.event_name != 'schedule'
    name: rake test truffleruby ${{ matrix.with_latest_reline && '(latest reline)' || '' }}
    strategy:
      matrix:
        with_latest_reline: [true, false]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      WITH_LATEST_RELINE: ${{matrix.with_latest_reline}}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: truffleruby
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Run tests in isolation
        run: bundle exec rake test_in_isolation
